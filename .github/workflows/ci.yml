name: CI

# Her push/PR'da: sözdizimi + tanımsız isim kontrolü (ruff) ve tam test paketi.
# Sunucu venv'i Python 3.12 — CI aynı sürümü kullanır (parite).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: "Ruff (yalnız gerçek hatalar: sözdizimi, tanımsız isim, yanlış f-string)"
        run: ruff check --select E9,F63,F7,F82 src tests scripts

      - name: "Test ortamı (.env = env.example; Settings zorunlu alanları için)"
        run: cp env.example .env

      - name: Testler
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest tests -q -p no:cacheprovider --durations=5

      - name: Deploy script sözdizimi
        run: bash -n scripts/deploy.sh && bash -n scripts/server_deploy.sh && bash -n scripts/ring_env_diff.sh
        # docker_run.sh container yolunun kapısıdır (entry-halt / 418 / supervisord).
        # Sözdizimi kırılırsa taşıma reçetesi çalışmaz.

      - name: "Container script sözdizimi"
        run: bash -n scripts/docker_run.sh

  # Container görüntüsü GERÇEKTEN derleniyor mu? YALNIZ BUILD — push YOK, çalıştırma YOK.
  # Sözleşme testleri (tests/test_container.py) statiktir ve `test` işinde koşar;
  # bu iş, statik testin göremeyeceği tek şeyi kanıtlar: bağımlılıklar taban
  # görüntüde gerçekten kuruluyor ve kod katmanı kopyalanıyor.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: "Görüntüyü derle (build-only, push YOK)"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tradingbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Görüntü sözleşmesi: non-root + tek süreç + testler içeride"
        run: |
          set -euo pipefail
          # Non-root
          uid="$(docker run --rm --entrypoint id tradingbot:ci -u)"
          test "$uid" != "0" || { echo "HATA: container root olarak koşuyor"; exit 1; }
          echo "container uid=$uid (root değil)"
          # Testler ve sözleşme dosyaları görüntüde mi? (container içi pytest = deploy kapısı)
          docker run --rm --entrypoint sh tradingbot:ci -c \
            'test -d tests && test -f conftest.py && test -f pytest.ini && test -f Dockerfile && test -f docker-compose.yml'
          # .env görüntüye GÖMÜLMEMİŞ olmalı (mount edilir)
          if docker run --rm --entrypoint sh tradingbot:ci -c 'test -f /app/.env'; then
            echo "HATA: .env görüntüye gömülmüş"; exit 1
          fi
          echo "görüntü sözleşmesi TAMAM"
