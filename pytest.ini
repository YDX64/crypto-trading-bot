[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio: async test ve fixture'lar dekoratör gerektirmeden çalışır
asyncio_mode = auto

markers =
    integration: gerçek ağ çağrısı yapan testler (Binance testnet)

filterwarnings =
    ignore::DeprecationWarning
